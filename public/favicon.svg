  <circle cx="32" cy="32" r="32" fill="#152238"/>
  <!-- Mortarboard cap top (diamond) -->
  <polygon points="32,12 52,22 32,32 12,22" fill="#E2E8F5"/>
  <!-- Cap board highlight -->
  <polygon points="32,12 52,22 32,32 12,22" fill="none" stroke="#2C4573" stroke-width="1"/>
  <!-- Left side of cap body -->
  <path d="M14 24 L14 36 Q14 40 20 42 L32 46 L44 42 Q50 40 50 36 L50 24" fill="#22375C"/>
  <!-- Front face of cap -->
