  <line x1="50" y1="22" x2="50" y2="36" stroke="#E2E8F5" stroke-width="2" stroke-linecap="round"/>
  <!-- Tassel ball -->
  <circle cx="50" cy="38" r="3" fill="#E2E8F5"/>
  <!-- Tassel fringe -->
  <line x1="48" y1="41" x2="46" y2="46" stroke="#E2E8F5" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="41" x2="50" y2="47" stroke="#E2E8F5" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="41" x2="54" y2="46" stroke="#E2E8F5" stroke-width="1.5" stroke-linecap="round"/>
</svg>
